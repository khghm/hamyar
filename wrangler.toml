name = "hamyar"
compatibility_date = "2026-01-01"

# ---------------------------------------------------------------------------
# استقرار فقط-استاتیک (بدون Worker script).
#
# `not_found_handling = "single-page-application"` حیاتی است: بدون آن، هر مسیری
# که فایل استاتیک نباشد (مثل /admin یا /profile) با 404 خالی پاسخ می‌گیرد و
# مرورگر خطای `net::ERR_HTTP_RESPONSE_CODE_FAILURE` می‌دهد — دقیقاً همان چیزی
# که با حذف Worker و رفتن به حالت assets-only اتفاق افتاد.
#
# با این تنظیم، Cloudflare خودش برای مسیرهای ناشناخته `index.html` را با کد ۲۰۰
# برمی‌گرداند و React Router بقیهٔ کار را انجام می‌دهد.
# ---------------------------------------------------------------------------
[assets]
directory = "dist"
not_found_handling = "single-page-application"
