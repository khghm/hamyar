name = "hamyar"
compatibility_date = "2026-01-01"
main = "src/index.js"

# ---------------------------------------------------------------------------
# استاتیک‌ها از dist سرو می‌شوند و `src/index.js` هم endpointهای پرداخت
# زرین‌پال را دارد (/api/zarinpal/request و /api/zarinpal/verify) و هم fallback
# مسیرهای SPA را برمی‌گرداند.
#
# متغیرهای عمومی (بدون secret):
#   SUPABASE_HOST / SUPABASE_ANON_KEY / ZARINPAL_MODE
#
# Secretها (با `npx wrangler secret put <NAME>` تنظیم می‌شوند):
#   SUPABASE_SERVICE_ROLE_KEY  ← فقط سمت سرور، هرگز در مرورگر
#   ZARINPAL_MERCHANT_ID       ← در حالت sandbox خالی/تستی است
#   KAVENEGAR_API_KEY          ← کلید سرویس پیامک کاوه‌نگار (ورود با موبایل)
#   KAVENEGAR_SENDER           ← اختیاری: شمارهٔ خط فرستنده
#   KAVENEGAR_TEMPLATE         ← اختیاری: نام الگوی verify/lookup (پیشنهادی)
#   OTP_PEPPER                 ← اختیاری: نمک هش کدهای یک‌بارمصرف
#
# برای رفتن به درگاه واقعی، فقط این دو را عوض کنید (بدون تغییر کد):
#   wrangler secret put ZARINPAL_MERCHANT_ID     (مرچنت ۳۶ کاراکتری زرین‌پال)
#   و در [vars] مقدار ZARINPAL_MODE را از sandbox به live تغییر دهید.
# ---------------------------------------------------------------------------

[vars]
SUPABASE_HOST = "rcimwpsnekxsxeivpivm.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_a0tACiO-Z-n-1AIgh26m9A_lbJNpzLx"
ZARINPAL_MODE = "sandbox"
# ورود مشتری با شماره موبایل (OTP):
#   با OTP_DEV_MODE="1" کد در پاسخ /api/otp/request برگردانده می‌شود (فقط برای
#   تست، بدون ارسال پیامک). در محیط واقعی همیشه "0" باشد و کلید کاوه‌نگار ست شود.
OTP_DEV_MODE = "0"

[assets]
directory = "dist"
# نام binding برای دسترسی Worker به فایل‌های استاتیک (env.ASSETS). بدون این خط،
# Worker به assets دسترسی ندارد و مسیرهای SPA با خطای «Assets binding is not
# configured» می‌شکنند.
binding = "ASSETS"
# با وجود Worker، fallback مسیرهای SPA را خود Worker انجام می‌دهد (بر اساس
# هدر Accept). اگر اینجا «single-page-application» بگذاریم، ASSETS برای فایل
# هش‌دارِ ناموجود هم index.html برمی‌گرداند و مرورگر به‌جای ۴۰۴، HTML با
# MIME اشتباه می‌گیرد.
not_found_handling = "none"
