    <!--
      فونت به‌صورت non-blocking بارگذاری می‌شود.
      قبلاً یک `@import` داخل <style> بود که رندر صفحه را تا دریافت پاسخ از
      fonts.googleapis.com قفل می‌کرد؛ روی شبکه‌ای که این دامنه کند یا فیلتر
      است، همان یک درخواست می‌توانست صفحه را دقایقی سفید نگه دارد. آیکون‌های
      FontAwesome (cdnjs) هم حذف شدند چون فقط ۵ آیکون شبکهٔ اجتماعی از آن‌ها
      استفاده می‌کرد و حالا با lucide-react (که از قبل در باندل هست) رسم می‌شوند.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
      * { font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Arial, sans-serif; }
      /* اسپینر CSS تا قبل از اجرای React؛ اگر دانلود JS طول بکشد کاربر صفحهٔ
         کاملاً سفید نمی‌بیند. */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        margin: auto;
        width: 34px;
        height: 34px;
        border: 3px solid #dbeafe;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: hamyar-spin 0.8s linear infinite;
      }
      @keyframes hamyar-spin { to { transform: rotate(360deg); } }

      /* پیام خطای بوت: اگر باندل دانلود نشود، اسپینر بی‌پایان نمی‌چرخد. */
      .boot-error {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        padding: 24px; text-align: center; background: #f8fafc; color: #334155;
        font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Arial, sans-serif;
      }
      .boot-error h1 { font-size: 17px; margin: 0; }
      .boot-error p { font-size: 13px; margin: 0; color: #64748b; max-width: 340px; line-height: 1.9; }
      .boot-error button {
        margin-top: 8px; padding: 10px 22px; border: 0; border-radius: 10px;
        background: #2563eb; color: #fff; font-size: 14px; cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!--
      اگر فایل‌های JS به هر دلیل دانلود نشوند (شبکهٔ ناپایدار، دامنهٔ فیلترشده)،
      کاربر به‌جای اسپینر ابدی، پیام روشن و دکمهٔ تلاش دوباره می‌بیند.
      این اسکریپت مستقل از باندل است، پس همیشه اجرا می‌شود.
    -->
    <script>
      (function () {
        var shown = false;
        function showBootError() {
          if (shown) return;
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          shown = true;
          root.innerHTML =
            '<div class="boot-error">' +
            '<h1>اتصال به سرور برقرار نشد</h1>' +
            '<p>بارگذاری سایت کامل نشد؛ معمولاً به دلیل قطعی یا اختلال شبکه است. ' +
            'اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>' +
            '<button type="button" onclick="location.reload()">تلاش دوباره</button>' +
            '</div>';
        }
        window.addEventListener('error', function (e) {
          if (e && e.target && e.target.tagName === 'SCRIPT') setTimeout(showBootError, 1500);
        }, true);
        setTimeout(showBootError, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
